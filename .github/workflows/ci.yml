name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Go tests
        run: go test $(go list ./... | grep -v /node_modules/)
      - name: Web tests
        working-directory: apps/web
        run: |
          npm ci
          npm test
      - name: Secrets stay off the browser bundle
        run: bash scripts/check-secrets.sh
