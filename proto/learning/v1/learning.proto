syntax = "proto3";

package learning.v1;

option go_package = "aperture/gen/learning/v1;learningv1";

import "proto/common/v1/types.proto";

service LearningService {
  rpc RecordTrade(RecordTradeRequest) returns (RecordTradeResponse);
  rpc ListJournal(ListJournalRequest) returns (ListJournalResponse);
  rpc GetWeights(GetWeightsRequest) returns (GetWeightsResponse);
  rpc RunBacktest(RunBacktestRequest) returns (BacktestReport);
  rpc GetBacktest(GetBacktestRequest) returns (BacktestReport);
  // RecordPeriod appends one sleeve-period result to periods.jsonl. Like
  // RecordTrade it never writes weights; only the scheduled review does.
  rpc RecordPeriod(RecordPeriodRequest) returns (RecordPeriodResponse);
}

// Period is one sleeve's result over one rebalance period, judged against
// the client's IPS benchmark after costs. Mirrors pkg/learn.Period.
message Period {
  string ips_id = 1;
  string sleeve = 2;   // core | satellite
  string method = 3;   // core, or the satellite method
  int64 from_unix_ms = 4;
  int64 to_unix_ms = 5;
  double pnl_after_costs = 6;
  double excess_vs_ips_pp = 7;
  double excess_vs_nifty_pp = 8;
  double max_dd = 9;
  int32 fills = 10;
  double mae = 11;
  double mfe = 12;
}

message RecordPeriodRequest {
  Period period = 1;
}

message RecordPeriodResponse {}

message RunBacktestRequest {
  int32 years = 1;
}

message GetBacktestRequest {}

message BacktestVariant {
  string strategy_id = 1;
  string method = 2;
  string timeframe = 3;
  string params = 4;
  double return_pct = 5;
  double excess_pct = 6;
  double win_rate = 7;
  int32 trades = 8;
  bool promoted = 9;
  string lesson = 10;
}

message BacktestReport {
  int32 years = 1;
  int32 variants_tested = 2;
  int32 variants_promoted = 3;
  string status = 4;
  int64 ran_at_unix_ms = 5;
  double nifty_return_pct = 6;
  repeated BacktestVariant variants = 7;
  string note = 8;
}

message RecordTradeRequest {
  common.v1.PaperTrade trade = 1;
}

message RecordTradeResponse {
  common.v1.JournalEntry entry = 1;
}

message ListJournalRequest {
  int32 limit = 1;
}

message ListJournalResponse {
  repeated common.v1.JournalEntry entries = 1;
}

message GetWeightsRequest {}

message GetWeightsResponse {
  repeated common.v1.StrategyWeight weights = 1;
}
