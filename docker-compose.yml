# Aperture desk + five gRPC backends + HTTP gateway.
# Do not put API keys in NEXT_PUBLIC_*. Pass secrets via env / .env only.
# No INDstocks token here on purpose: the hero must show MOCK.

services:
  marketdata:
    build:
      context: .
      args: { SERVICE: marketdata }
    environment:
      MARKETDATA_BIND: ":9081"
      LOG_FORMAT: json
    ports: ["9081:9081"]
  learning:
    build:
      context: .
      args: { SERVICE: learning }
    environment:
      LEARNING_BIND: ":9083"
      LEARNING_DIR: /data/learning
      LOG_FORMAT: json
    volumes: ["learning-data:/data/learning"]
    ports: ["9083:9083"]
  sentiment:
    build:
      context: .
      args: { SERVICE: sentiment }
    environment:
      SENTIMENT_BIND: ":9084"
      MAX_INVESTIGATION_WORKERS: "16"
      NEWS_REFRESH_SECONDS: "900"
      LOG_FORMAT: json
      NEWSAPI_KEY: ${NEWSAPI_KEY:-}
      CURRENTS_API_KEY: ${CURRENTS_API_KEY:-}
      FINNHUB_API_KEY: ${FINNHUB_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
    ports: ["9084:9084"]
  advisor:
    build:
      context: .
      args: { SERVICE: advisor }
    environment:
      ADVISOR_BIND: ":9085"
      LOG_FORMAT: json
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
    ports: ["9085:9085"]
  trading:
    build:
      context: .
      args: { SERVICE: trading }
    environment:
      TRADING_BIND: ":9082"
      MARKETDATA_ADDR: "marketdata:9081"
      LEARNING_ADDR: "learning:9083"
      SENTIMENT_ADDR: "sentiment:9084"
      AUTOSTART_CAMPAIGN: "true"
      SCALP_MODE: "false"
      LOG_FORMAT: json
    ports: ["9082:9082"]
    depends_on: [marketdata, learning, sentiment]
  gateway:
    build:
      context: .
      args: { SERVICE: gateway }
    environment:
      GATEWAY_BIND: ":8080"
      MARKETDATA_ADDR: "marketdata:9081"
      TRADING_ADDR: "trading:9082"
      LEARNING_ADDR: "learning:9083"
      SENTIMENT_ADDR: "sentiment:9084"
      ADVISOR_ADDR: "advisor:9085"
      GATEWAY_RPS: "40"
      GATEWAY_BURST: "80"
      CAMPAIGN_DIR: /app/campaign/public-30d
      LOG_FORMAT: json
    ports: ["8080:8080"]
    depends_on: [marketdata, trading, learning, sentiment, advisor]
  web:
    image: node:22
    working_dir: /app
    volumes: ["./apps/web:/app"]
    command: sh -c "npm install && npx next dev --turbopack -p 43127 -H 0.0.0.0"
    environment:
      NEXT_PUBLIC_API_URL: http://127.0.0.1:8080
    ports: ["43127:43127"]
    depends_on: [gateway]

volumes:
  learning-data:
